[package]
name = "trend-plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rasq-plugin-kit = { path = "kit" }
serde_json = "1"

[workspace]
members = ["kit"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
