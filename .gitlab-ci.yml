image: rust:1.90
stages: [test, build]
test:
  stage: test
  script: [cargo test]
build:
  stage: build
  script:
    - rustup target add wasm32-unknown-unknown
    - cargo build --release --target wasm32-unknown-unknown
    - mkdir -p dist && cp target/wasm32-unknown-unknown/release/*.wasm dist/
  artifacts:
    paths: [dist/]
